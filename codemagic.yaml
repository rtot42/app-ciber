workflows:
  ios-capacitor:
    name: CiberKids iOS App Store
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: CiberKids

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.rtot42.ciberkids
      node: 24
      xcode: latest
      vars:
        APP_STORE_CONNECT_ALTOOL_ADDITIONAL_ARGUMENTS: "--use-old-altool"

    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Build web app
        script: |
          npm run build

      - name: Sync Capacitor
        script: |
          npx cap sync ios

      - name: Set up iOS signing
        script: |
          xcode-project use-profiles

      - name: Set iOS build number
        script: |
          cd "$CM_BUILD_DIR/ios/App"

          BUILD_NUMBER=101
          echo "Setting iOS build number: $BUILD_NUMBER"

          PROJECT_FILE="App.xcodeproj/project.pbxproj"

          if [ ! -f "$PROJECT_FILE" ]; then
            echo "Xcode project not found"
            exit 1
          fi

          export BUILD_NUMBER

          perl -0pi -e 's/CURRENT_PROJECT_VERSION = [^;]+;/CURRENT_PROJECT_VERSION = $ENV{BUILD_NUMBER};/g' "$PROJECT_FILE"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleVersion $BUILD_NUMBER" \
            App/Info.plist 2>/dev/null || true

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/ios/App/App.xcodeproj" \
            --scheme "App"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
